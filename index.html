<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Entre em contato</h2>
                <form>
                    <label class="form-label" for="nome">Digite o seu nome:</label>
                    <input class="form-control" type="text" id="nome">
                    
                    <label class="form-label" for="email">Seu e-mail:</label>
                    <input class="form-control" type="email" id="email">
                    
                    <label class="form-label" for="tel">Seu Telefone</label>
                    <input class="form-control" type="tel" id="telefone">

                    <label for="mensagem" class="form-label">Sua mensagem:</label>                    
                    <textarea class="form-control" id="mensagem"></textarea>
                    
                    <div class="form-check form-switch">
                        <label class="form-check-label" for="aceito">Li e concordo com os termos do site</label>
                        <input class="form-check-input" type="checkbox" id="aceito">
                    </div>
                    
                    <button class="btn btn-success">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="./js/jquery.mask.min.js"></script>
    
    <script src="./script.js"></script>
</body>
</html>
